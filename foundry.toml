[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "london"          # Mezo's documented EVM version
optimizer = true
optimizer_runs = 200
remappings = ["openzeppelin-contracts/=lib/openzeppelin-contracts/"]

[fuzz]
runs = 1000                      # the testing checklist's minimum

[invariant]
runs = 256
depth = 32

[profile.ci]
verbosity = 3

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
mezo = "https://mezo.drpc.org"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
base_sepolia = "https://base-sepolia-rpc.publicnode.com"
